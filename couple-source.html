<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our RSVPs</title>
<style>
:root{--a:#b8434f}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 Georgia,serif;background:#faf5f2;color:#2b2226}
header{text-align:center;padding:26px 16px 8px}h1{font:400 40px/1.1 cursive;margin:0;color:var(--a)}
.when{color:#7a6a6e;letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin-top:6px}
main{max-width:820px;margin:0 auto;padding:12px 14px 40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.stat{background:#fff;border:1px solid #eaded8;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:30px;color:var(--a);line-height:1.1}.stat span{font-size:12px;color:#7a6a6e}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{font:600 14px system-ui,sans-serif;padding:9px 14px;border:0;border-radius:999px;background:#efe6e1;color:#3a2a2e;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--a);color:#fff}
.card{background:#fff;border:1px solid #eaded8;border-radius:14px;overflow:hidden}
.row{padding:11px 14px;border-bottom:1px solid #f0e6e1;display:flex;justify-content:space-between;gap:10px}.row:last-child{border:0}
.row b{font-weight:600}.note{font-style:italic;color:#5a4a4e;font-size:14px;margin-top:2px}
.pill{font:600 12px system-ui,sans-serif;padding:3px 9px;border-radius:999px;background:#f3e9e4;color:#5a4a4e;white-space:nowrap;align-self:flex-start}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.gal button{position:relative;padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#e9dfda;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}.gal em{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font:11px system-ui,sans-serif;font-style:normal;padding:1px 6px;border-radius:6px}
.lb{position:fixed;inset:0;background:rgba(30,15,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 12px 16px;z-index:9}.lb[hidden]{display:none}
.lb .bd{flex:1;min-height:0;width:100%;max-width:640px;display:flex;align-items:center;justify-content:center}.lb img{max-width:100%;max-height:100%;border-radius:10px}.lb iframe{width:100%;height:100%;border:0;border-radius:10px;background:#000}
.lb .x{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:24px;cursor:pointer}.lb a{color:#f6d5da;margin-top:10px;font:14px system-ui,sans-serif}
.bubble{padding:12px 14px;border-bottom:1px solid #f0e6e1}.bubble:last-child{border:0}.bubble p{margin:4px 0 0;white-space:pre-wrap;word-wrap:break-word}.bubble small{color:#7a6a6e;font:12px system-ui,sans-serif}
.msg{text-align:center;color:#7a6a6e;padding:30px 10px}.top{text-align:center;margin-top:14px}.top button{font:600 13px system-ui,sans-serif;padding:8px 14px;border:0;border-radius:9px;background:#efe6e1;cursor:pointer}
</style></head><body>
<header><h1 id="names">Our RSVPs</h1><div class="when" id="when"></div></header>
<main id="app"><p class="msg">Loading…</p></main>
<div class="lb" id="lb" hidden><button class="x" id="lbx" aria-label="Close">×</button><div class="bd" id="bd"></div><a id="dl" target="_blank" rel="noopener">Open / download from Google Drive</a></div>
<script>
var ACC={blush:'#b8434f',burgundy:'#741c2e',sage:'#4d6b49',navy:'#8a6520',lavender:'#64468f',champagne:'#8c6a36'};
var KEY='',D=null,TAB='yes';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ago(t){if(!t)return '';var d=new Date(t);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function load(){
  google.script.run.withSuccessHandler(function(d){D=d;draw()}).withFailureHandler(function(e){$('app').innerHTML='<p class="msg">'+esc(e.message||'This link is not valid.')+'</p>'}).couple_data(KEY);
}
function draw(){
  document.documentElement.style.setProperty('--a',ACC[D.scheme]||'#b8434f');
  $('names').textContent=(D.one&&D.two)?D.one+' & '+D.two:D.event;$('when').textContent=D.dateLine;document.title=D.event;
  var tabs=[['yes','Coming ('+D.yes.length+')'],['no','Declined ('+D.no.length+')'],['wait','Waiting ('+D.wait.length+')'],['msgs','Messages ('+(D.messages||[]).length+')'],['pics','Photos ('+D.gallery.length+')']];
  var h='<div class="stats"><div class="stat"><b>'+D.heads+'</b><span>guests coming</span></div><div class="stat"><b>'+D.no.length+'</b><span>declined</span></div><div class="stat"><b>'+D.wait.length+'</b><span>not replied yet</span></div></div>';
  h+='<div class="tabs">'+tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>';
  if(TAB==='msgs'){
    var M=D.messages||[];
    h+='<div class="card">'+(M.length?M.map(function(m){return '<div class="bubble"><b>'+esc(m.from)+'</b> <small>'+ago(m.at)+'</small><p>'+esc(m.text)+'</p></div>'}).join(''):'<p class="msg">No messages yet.</p>')+'</div>';
  } else if(TAB==='pics'){
    h+=D.gallery.length?'<div class="gal">'+D.gallery.map(function(g,i){return '<button data-i="'+i+'"><img loading="lazy" alt="" src="https://drive.google.com/thumbnail?id='+esc(g.id)+'&sz=w300"><em>'+(g.type==='video'?'▶ ':'')+esc(g.from)+'</em></button>'}).join('')+'</div>':'<p class="msg">No photos or videos shared yet.</p>';
  } else {
    var L=D[TAB];
    h+='<div class="card">'+(L.length?L.map(function(g){
      var right=TAB==='yes'?'<span class="pill">'+g.count+(g.count>1?' guests':' guest')+(g.table?' · Table '+esc(g.table):'')+'</span>':TAB==='wait'?'<span class="pill">'+g.seats+' seat'+(g.seats>1?'s':'')+'</span>':'<span class="pill">'+ago(g.at)+'</span>';
      return '<div class="row"><div><b>'+esc(g.name)+'</b>'+(g.note?'<div class="note">“'+esc(g.note)+'”</div>':'')+'</div>'+right+'</div>';
    }).join(''):'<p class="msg">Nobody here yet.</p>')+'</div>';
  }
  h+='<div class="top"><button id="rf">Refresh</button></div>';
  $('app').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){b.onclick=function(){TAB=b.getAttribute('data-t');draw()}});
  [].forEach.call(document.querySelectorAll('.gal button'),function(b){b.onclick=function(){show(D.gallery[Number(b.getAttribute('data-i'))])}});
  $('rf').onclick=load;
}
function show(g){
  $('bd').innerHTML=g.type==='video'?'<iframe allow="autoplay; fullscreen" allowfullscreen src="https://drive.google.com/file/d/'+encodeURIComponent(g.id)+'/preview"></iframe>':'<img alt="" src="https://drive.google.com/thumbnail?id='+encodeURIComponent(g.id)+'&sz=w1600">';
  $('dl').href='https://drive.google.com/file/d/'+encodeURIComponent(g.id)+'/view';$('lb').hidden=false;
}
$('lbx').onclick=function(){$('lb').hidden=true;$('bd').innerHTML=''};
google.script.url.getLocation(function(loc){KEY=(loc.parameter||{}).view||'';load();setInterval(function(){if($('lb').hidden)load()},60000)});
</script></body></html>
