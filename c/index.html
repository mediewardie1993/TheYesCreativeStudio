<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our RSVPs</title>
<style>
:root{--a:#b8434f}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 Georgia,serif;background:#f7f3ea;color:#2b2226}
header{text-align:center;padding:26px 16px 18px;background:var(--a);color:#fff}h1{font:400 40px/1.1 cursive;margin:0;color:#fff}
.when{color:rgba(255,255,255,.85);letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin-top:6px}
main{max-width:820px;margin:0 auto;padding:12px 14px 40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.stat{background:#fff;border:1px solid #e4dcc9;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:30px;color:var(--a);line-height:1.1}.stat span{font-size:12px;color:#7a6a6e}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{font:600 14px system-ui,sans-serif;padding:9px 14px;border:0;border-radius:999px;background:#ece4d2;color:#3a2a2e;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--a);color:#fff}
.card{background:#fff;border:1px solid #e4dcc9;border-radius:14px;overflow:hidden}
.row{padding:11px 14px;border-bottom:1px solid #ebe4d3;display:flex;justify-content:space-between;gap:10px}.row:last-child{border:0}
.row b{font-weight:600}.note{font-style:italic;color:#5a4a4e;font-size:14px;margin-top:2px}
.pill{font:600 12px system-ui,sans-serif;padding:3px 9px;border-radius:999px;background:#efe8d8;color:#5a4a4e;white-space:nowrap;align-self:flex-start}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.gal button{position:relative;padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#e9dfda;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}.gal em{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font:11px system-ui,sans-serif;font-style:normal;padding:1px 6px;border-radius:6px}
.lb{position:fixed;inset:0;background:rgba(30,15,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 12px 16px;z-index:9}.lb[hidden]{display:none}
.lb .bd{flex:1;min-height:0;width:100%;max-width:640px;display:flex;align-items:center;justify-content:center}.lb img{max-width:100%;max-height:100%;border-radius:10px}.lb iframe{width:100%;height:100%;border:0;border-radius:10px;background:#000}
.lb .x{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:24px;cursor:pointer}.lb a{color:#f6d5da;margin-top:10px;font:14px system-ui,sans-serif}
.bubble{padding:12px 14px;border-bottom:1px solid #ebe4d3}.bubble:last-child{border:0}.bubble p{margin:4px 0 0;white-space:pre-wrap;word-wrap:break-word}.bubble small{color:#7a6a6e;font:12px system-ui,sans-serif}
.lb .acts{display:flex;gap:8px;margin-top:12px}.lb .acts button{font:600 14px system-ui,sans-serif;padding:9px 16px;border:0;border-radius:9px;background:#fff;color:#2b2226;cursor:pointer}.lb .acts button.del{background:#8a1f2b;color:#fff}.lb .acts button:disabled{opacity:.5}
.lb .pm{color:#f6d5da;font:13px system-ui,sans-serif;margin:8px 0 0;min-height:16px;text-align:center}
.hid{margin:22px 0 8px;font:600 13px system-ui,sans-serif;color:#7a6a6e;letter-spacing:.06em;text-transform:uppercase}.gal.off img{opacity:.45}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sheet{width:100%;border-collapse:collapse;font:14px system-ui,sans-serif;min-width:620px}.sheet th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7a6a6e;padding:8px 6px;background:#f7f3ea;border:1px solid #e4dcc9}
.sheet td{padding:0;border:1px solid #e4dcc9;vertical-align:middle}.sheet input{width:100%;border:0;padding:9px 6px;font:inherit;background:transparent;color:inherit;min-width:54px}.sheet input:focus{outline:2px solid var(--a);outline-offset:-2px;background:#fff}
.sheet td.c{padding:5px 6px;white-space:nowrap}.sheet td.c b{font:600 14px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}.sheet button{font:600 12px system-ui,sans-serif;padding:4px 8px;border:0;border-radius:7px;background:#ece4d2;color:#3a2a2e;cursor:pointer;margin-left:4px}
.sheet tr.new td{background:#fbf9f3}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.tools button{font:600 13px system-ui,sans-serif;padding:9px 13px;border:0;border-radius:9px;background:var(--a);color:#fff;cursor:pointer}.tools button.g{background:#ece4d2;color:#3a2a2e}
.note2{font:13px/1.4 system-ui,sans-serif;color:#7a6a6e;margin:0 0 10px}.say{font:13px system-ui,sans-serif;color:#7a6a6e;min-height:18px;margin:8px 2px 0}
.msg{text-align:center;color:#7a6a6e;padding:30px 10px}.top{text-align:center;margin-top:14px}.top button{font:600 13px system-ui,sans-serif;padding:8px 14px;border:0;border-radius:9px;background:#ece4d2;cursor:pointer}
.pad{padding:14px}
.ptitle{font:600 11px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7a6a6e;margin:0 2px 6px}
.tabs.pl button{background:#fff;border:1px solid #e4dcc9}.tabs.pl button.on{background:var(--a);border-color:var(--a)}
.tools input{font:14px system-ui,sans-serif;padding:9px 10px;border:1px solid #d8cdb5;border-radius:9px;min-width:0;flex:1 1 140px;background:#fff}
.sheet.plan select{border:0;background:transparent;font:inherit;padding:9px 4px;width:100%}
.bar{height:8px;background:#ece4d2;border-radius:999px;overflow:hidden;margin:4px 0 6px}.bar i{display:block;height:100%;background:var(--a)}
.stats.four{grid-template-columns:repeat(2,1fr)}@media(min-width:620px){.stats.four{grid-template-columns:repeat(4,1fr)}}.stats.four .stat b{font-size:22px}
.drop{background:#fff;border:1px solid #e4dcc9;border-radius:14px;padding:12px;cursor:pointer}.drop.hot{outline:2px solid var(--a)}.drop.un{margin-bottom:12px}
.th{display:flex;justify-content:space-between;font:14px system-ui,sans-serif;margin-bottom:8px}.th span{color:#7a6a6e}
.tbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.tbl{text-align:center}
.round{width:92px;height:92px;border-radius:50%;margin:2px auto 10px;background:var(--a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:14px system-ui,sans-serif;box-shadow:0 0 0 6px #f1e9d9}
.round b{font-size:17px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.round.over{background:#8a1f2b}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.un .chips{justify-content:flex-start}.chips em{font:13px system-ui,sans-serif;color:#9a8c8f}
.chip{font:600 13px system-ui,sans-serif;padding:6px 10px;border-radius:999px;border:1px solid #d8cdb5;background:#faf6ec;color:#2b2226;cursor:grab}.chip.wait{border-style:dashed;font-weight:500}.chip.sel{background:var(--a);color:#fff;border-color:var(--a)}.chip i{font-style:normal;opacity:.7}
.rmt{font:12px system-ui,sans-serif;border:0;background:none;color:#9a8c8f;margin-top:10px;cursor:pointer;text-decoration:underline}
.qrow{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #ebe4d3}.qrow:last-child{border:0}.qrow input{flex:1 1 220px;min-width:0;font:14px system-ui,sans-serif;padding:9px 10px;border:1px solid #d8cdb5;border-radius:9px}.qrow button{border:0;background:#ece4d2;border-radius:8px;padding:8px 12px;cursor:pointer}
</style></head><body>
<header><h1 id="names">Our RSVPs</h1><div class="when" id="when"></div></header>
<main id="app"><p class="msg">Loading…</p></main>
<div class="lb" id="lb" hidden><button class="x" id="lbx" aria-label="Close">×</button><div class="bd" id="bd"></div><a id="dl" target="_blank" rel="noopener">Open / download from Google Drive</a><div class="acts"><button id="ph" type="button">Hide</button><button id="pd" type="button" class="del">Delete</button></div><p class="pm" id="pm"></p></div>
<script>
/* Lets the page use google.script.run / google.script.url exactly as it does inside Apps Script, but over plain fetch. */
(function () {
  var API = "https://script.google.com/macros/s/AKfycbzFcqfGDi2hsJ09sK_4WslxrgyA3h2S94j9AMx1hldGgGP13j_UpWp1XMlTkkFtgvQA/exec";
  if (window.google && google.script && google.script.run) return;
  function mk(ok, bad) {
    return new Proxy({}, { get: function (_, fn) {
      if (fn === "withSuccessHandler") return function (f) { return mk(f, bad); };
      if (fn === "withFailureHandler") return function (f) { return mk(ok, f); };
      return function () {
        var args = [].slice.call(arguments);
        if (fn === "getAppUrl") { if (ok) ok(location.href.split(/[?#]/)[0]); return; }
        // Google's Apps Script redirect occasionally bounces a fresh cross-origin call (not a real network problem) — a couple of quiet retries clears it.
        var attempt = 0;
        function go() {
          attempt++;
          fetch(API, { method: "POST", body: JSON.stringify({ fn: fn, args: args }) })
            .then(function (r) { if (!r.ok && attempt < 3) throw 0; return r.json(); })
            .then(function (j) {
              if (j && j.ok) { if (ok) ok(j.data); return; }
              if (attempt < 3) return retry();
              if (bad) bad(new Error((j && j.error) || "Something went wrong."));
            })
            .catch(function () {
              if (attempt < 3) return retry();
              if (bad) bad(new Error("Google's server had a hiccup. Please try again."));
            });
        }
        function retry() { setTimeout(go, 700 * attempt); }
        go();
      };
    } });
  }
  window.google = { script: { run: mk(null, null), url: { getLocation: function (cb) {
    var p = {}; new URLSearchParams(location.search).forEach(function (v, k) { p[k] = v; }); cb({ parameter: p });
  } } } };
})();
</script>
<script>
var ACC={blush:'#b8434f',burgundy:'#7e1f33',sage:'#4d6b49',navy:'#8a6520',lavender:'#64468f',champagne:'#8c6a36'};
var KEY='',D=null,TAB='yes';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ago(t){if(!t)return '';var d=new Date(t);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function load(){
  google.script.run.withSuccessHandler(function(d){D=d;draw()}).withFailureHandler(function(e){$('app').innerHTML='<p class="msg">'+esc(e.message||'This link is not valid.')+'</p>'}).couple_data(KEY);
}
function draw(){
  var acc=ACC[D.scheme]||'#b8434f';
  if(D.scheme==='custom'&&/^#[0-9a-f]{6}$/i.test(D.accent||'')){
    // the couple's own main colour: darkened if it is too pale to carry the white header text
    var c=[1,3,5].map(function(i){return parseInt(D.accent.slice(i,i+2),16)});
    for(var n=0;n<6&&(c[0]*299+c[1]*587+c[2]*114)/1000>150;n++)c=c.map(function(x){return x*.82});
    acc='rgb('+c.map(Math.round).join(',')+')';
  }
  document.documentElement.style.setProperty('--a',acc);
  $('names').textContent=(D.one&&D.two)?D.one+' & '+D.two:D.event;$('when').textContent=D.dateLine;document.title=D.event;
  var tabs=[['yes','Coming ('+D.yes.length+')'],['no','Declined ('+D.no.length+')'],['wait','Waiting ('+D.wait.length+')'],['list','Guest list ('+(D.guests||[]).length+')'],['msgs','Messages ('+(D.messages||[]).length+')'],['pics','Photos ('+D.gallery.length+')']];
  var h='<div class="stats"><div class="stat"><b>'+D.heads+'</b><span>guests coming</span></div><div class="stat"><b>'+D.no.length+'</b><span>declined</span></div><div class="stat"><b>'+D.wait.length+'</b><span>not replied yet</span></div></div>';
  if((D.meals||[]).length)tabs.push(['meals','Meals']);
  var tabRow=function(L,cls){return '<div class="tabs'+cls+'">'+L.map(function(t){return '<button data-t="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>'};
  h+=tabRow(tabs,'');
  // the paid planner (switched on per event in the admin app): its own row of tabs, unlocked with the planner PIN
  if(D.planner)h+='<div class="ptitle">Planner</div>'+tabRow(PTABS,' pl');
  if(TAB.indexOf('p-')===0&&!D.planner)TAB='yes';
  if(TAB==='meals'&&!(D.meals||[]).length)TAB='yes';
  if(TAB.indexOf('p-')===0){
    h+=plannerHtml();
  } else if(TAB==='meals'){
    var MT=mealTotals();
    h+='<div class="stats">'+D.meals.map(function(m){return '<div class="stat"><b>'+(MT[m]||0)+'</b><span>'+esc(m)+'</span></div>'}).join('')+'</div>';
    var MG=(D.guests||[]).filter(function(g){return g.rsvp==='Attending'});
    h+='<div class="card">'+(MG.length?MG.map(function(g){return '<div class="row"><div><b>'+esc((g.first+' '+g.last).trim())+'</b></div><span class="pill">'+esc(g.meal||'not chosen yet')+'</span></div>'}).join(''):'<p class="msg">Nobody has accepted yet.</p>')+'</div>';
  } else if(TAB==='list'){
    // The guest list as an editable sheet: type in a cell and it saves when you leave it. Each guest's login code is made by the randomizer.
    var G=D.guests||[];
    var cells=function(g){return ['first','last','seats','table'].map(function(f){return '<td><input data-f="'+f+'"'+(f==='seats'?' type="number" min="1" max="20" style="width:64px"':'')+' value="'+esc(g?g[f]:'')+'" placeholder="'+(g?'':{first:'Add a guest…',last:'Last name',seats:'1',table:''}[f])+'"></td>'}).join('')};
    h+='<div class="tools"><button id="gm">Make codes for guests without one</button><button id="ga" class="g">New codes for everyone</button></div>';
    h+='<p class="note2">Each guest logs in with <b>'+esc(D.code)+'-</b> followed by their own code, or just taps their personal link. '+(D.codesOnly?'The shared code '+esc(D.code)+' is switched off: only personal codes work.':'The shared code '+esc(D.code)+' still works too.')+'</p>';
    h+='<div class="card wrap"><table class="sheet"><thead><tr><th>First name</th><th>Last name</th><th>Seats</th><th>Table</th><th>Login code</th><th>Reply</th><th></th></tr></thead><tbody>';
    h+=G.map(function(g){
      var st=g.rsvp==='Attending'?'Attending '+g.attending:g.rsvp==='Declined'?'Declined':g.opened?'Opened, no reply':'Not opened';
      return '<tr data-r="'+g.row+'">'+cells(g)+'<td class="c">'+(g.code?'<b>'+esc(g.code)+'</b><button data-cp="'+esc(g.code)+'">Copy link</button>':'<span style="color:#7a6a6e">none yet</span>')+'<button data-nw title="Give this guest a new code">↻</button></td><td class="c">'+st+'</td><td class="c"><button data-rm title="Remove this guest">✕</button></td></tr>';
    }).join('');
    h+='<tr class="new" data-r="0">'+cells(null)+'<td class="c" colspan="3" style="color:#7a6a6e">Type a name here to add a guest</td></tr></tbody></table></div><p class="say" id="say"></p>';
  } else if(TAB==='msgs'){
    var M=D.messages||[];
    h+='<div class="card">'+(M.length?M.map(function(m){return '<div class="bubble"><b>'+esc(m.from)+'</b> <small>'+ago(m.at)+'</small><p>'+esc(m.text)+'</p></div>'}).join(''):'<p class="msg">No messages yet.</p>')+'</div>';
  } else if(TAB==='pics'){
    var tile=function(g,i,k){return '<button data-'+k+'="'+i+'"><img loading="lazy" alt="" src="https://drive.google.com/thumbnail?id='+esc(g.id)+'&sz=w300"><em>'+(g.type==='video'?'▶ ':'')+esc(g.from)+'</em></button>'};
    var HG=D.hiddenGallery||[];
    h+=D.gallery.length?'<div class="gal">'+D.gallery.map(function(g,i){return tile(g,i,'i')}).join('')+'</div>':'<p class="msg">'+(HG.length?'Every photo is hidden.':'No photos or videos shared yet.')+'</p>';
    // hidden ones stay in Drive but are off this page and the guests' gallery; tap one to show it again or delete it
    if(HG.length)h+='<div class="hid">Hidden ('+HG.length+')</div><div class="gal off">'+HG.map(function(g,i){return tile(g,i,'h')}).join('')+'</div>';
  } else {
    var L=D[TAB];
    h+='<div class="card">'+(L.length?L.map(function(g){
      var right=TAB==='yes'?'<span class="pill">'+g.count+(g.count>1?' guests':' guest')+(g.table?' · Table '+esc(g.table):'')+'</span>':TAB==='wait'?'<span class="pill">'+g.seats+' seat'+(g.seats>1?'s':'')+'</span>':'<span class="pill">'+ago(g.at)+'</span>';
      return '<div class="row"><div><b>'+esc(g.name)+'</b>'+(g.note?'<div class="note">“'+esc(g.note)+'”</div>':'')+'</div>'+right+'</div>';
    }).join(''):'<p class="msg">Nobody here yet.</p>')+'</div>';
  }
  h+='<div class="top"><button id="rf">Refresh</button></div>';
  $('app').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){b.onclick=function(){TAB=b.getAttribute('data-t');draw()}});
  [].forEach.call(document.querySelectorAll('.gal button'),function(b){b.onclick=function(){var h=b.getAttribute('data-h');if(h!=null)show(D.hiddenGallery[Number(h)],true);else show(D.gallery[Number(b.getAttribute('data-i'))],false)}});
  $('rf').onclick=load;
  if(TAB==='list')wireSheet();
  if(TAB.indexOf('p-')===0)wirePlanner();
}
/* ---------------- meals ---------------- */
// each guest's cell reads like "Beef ×2, Fish ×1"
function mealTotals(){
  var t={};
  (D.guests||[]).forEach(function(g){if(g.rsvp!=='Attending')return;String(g.meal||'').split(',').forEach(function(x){var m=x.match(/^\s*(.+?)\s*\u00d7(\d+)\s*$/);if(m)t[m[1]]=(t[m[1]]||0)+Number(m[2])})});
  return t;
}
/* ---------------- planner (paid extra): checklist, budget, run of the day, seating, vendors, questions ---------------- */
var PIN='',P=null,PTRY=false,SEL=0,SAVE_T={};
var PTABS=[['p-check','Checklist'],['p-budget','Budget'],['p-day','Run of the day'],['p-seat','Seating'],['p-vend','Vendors'],['p-q','Questions']];
// one editable sheet per section: [kind, heading, choices]. Each is saved as a tab in the event's Google Sheet.
var SPEC={
  'p-check':{sec:'checklist',add:'Add a task',cols:[['check','Done'],['text','Task'],['date','Due'],['text','Notes']]},
  'p-budget':{sec:'budget',add:'Add an item',cols:[['text','Item'],['text','Category'],['money','Planned'],['money','Actual cost'],['money','Paid so far'],['text','Notes']]},
  'p-day':{sec:'timeline',add:'Add a moment',cols:[['time','Time'],['text','What happens'],['text','Who is in charge'],['text','Notes']]},
  'p-vend':{sec:'vendors',add:'Add a vendor',cols:[['text','Name'],['text','Service'],['text','Contact person'],['text','Phone'],['money','Price'],['money','Deposit paid'],['sel','Status',['','Looking','Contacted','Booked','Paid in full']],['text','Notes']]}
};
var STARTER=['Set the date and the budget','Book the church or ceremony venue','Book the reception venue','Choose the caterer','Book the photographer and videographer','Choose the principal sponsors and the entourage','Attend the pre-marriage seminar','Apply for the marriage license','Order the wedding attire','Book hair and makeup','Buy the rings','Send the invitations','Finalise the guest list and seating','Confirm every vendor one week before','Prepare the payments and tips for the day'];
function pstore(v){try{var k='plan-pin-'+KEY.slice(0,12);if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){}return ''}
function psay(t){var e=$('psay');if(e)e.textContent=t||''}
function pcall(fn,args,ok,bad){
  var r=google.script.run.withSuccessHandler(function(x){if(ok)ok(x)}).withFailureHandler(function(e){(bad||psay)((e&&e.message)||'That did not work. Please try again.')});
  r[fn].apply(r,[KEY,PIN].concat(args));
}
function unlock(pin,quiet){
  PIN=pin;psay('Opening…');
  pcall('planner_get',[],function(d){P=d;pstore(pin);draw()},function(m){PIN='';if(quiet){pstore('');psay('')}else psay(m)});
}
// every edit saves the whole section a moment after the typing stops
function psave(sec){clearTimeout(SAVE_T[sec]);psay('Saving…');SAVE_T[sec]=setTimeout(function(){pcall('planner_save',[sec,P[sec]],function(){psay('Saved ✓')})},700)}
function num(v){return parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,''))||0}
function peso(n){return '₱'+Math.round(n).toLocaleString()}
function plannerHtml(){
  if(!P)return '<div class="card pad"><b>Planner</b><p class="note2" style="margin-top:6px">Type the planner PIN you were given to open your checklist, budget, seating chart and more.</p><div class="tools"><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off"><button id="pgo">Unlock</button></div><p class="say" id="psay"></p></div>';
  if(TAB==='p-seat')return seatHtml();
  if(TAB==='p-q')return qHtml();
  return gridHtml(SPEC[TAB]);
}
function gridSummary(sp){
  var R=P[sp.sec],st=function(v,l){return '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>'};
  if(sp.sec==='checklist'){var done=R.filter(function(r){return r[0]==='Yes'}).length;return '<div class="bar"><i style="width:'+(R.length?Math.round(done/R.length*100):0)+'%"></i></div><p class="note2">'+done+' of '+R.length+' done</p>'}
  if(sp.sec==='budget'){var e=0,a=0,pd=0,due=0;R.forEach(function(r){e+=num(r[2]);a+=num(r[3]);pd+=num(r[4]);due+=Math.max(0,(num(r[3])||num(r[2]))-num(r[4]))});return '<div class="stats four">'+st(peso(e),'planned')+st(peso(a),'actual so far')+st(peso(pd),'paid')+st(peso(due),'still to pay')+'</div>'}
  if(sp.sec==='vendors'){var bk=0,tot=0,dep=0;R.forEach(function(r){if(r[6]==='Booked'||r[6]==='Paid in full')bk++;tot+=num(r[4]);dep+=num(r[5])});return '<div class="stats">'+st(bk+' / '+R.length,'booked')+st(peso(tot),'total price')+st(peso(dep),'deposits paid')+'</div>'}
  return '<p class="note2">Moments are put in order of time. Put a name under “Who is in charge” to hand that task to someone.</p>';
}
function cell(c,v,j){
  v=v==null?'':v;
  if(c[0]==='check')return '<input type="checkbox" data-c="'+j+'"'+(v==='Yes'?' checked':'')+' style="width:20px;height:20px;min-width:0">';
  if(c[0]==='sel')return '<select data-c="'+j+'">'+c[2].map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
  return '<input data-c="'+j+'" value="'+esc(v)+'"'+(c[0]==='date'?' type="date"':c[0]==='time'?' type="time"':c[0]==='money'?' inputmode="decimal" placeholder="0"':'')+'>';
}
function gridHtml(sp){
  var R=P[sp.sec];
  if(sp.sec==='timeline')R.sort(function(a,b){var x=a[0]||'99',y=b[0]||'99';return x<y?-1:x>y?1:0});
  var h='<div id="psum">'+gridSummary(sp)+'</div><div class="card wrap"><table class="sheet plan"><thead><tr>'+sp.cols.map(function(c){return '<th>'+c[1]+'</th>'}).join('')+'<th></th></tr></thead><tbody>';
  h+=R.map(function(r,i){return '<tr data-i="'+i+'">'+sp.cols.map(function(c,j){return '<td'+(c[0]==='check'?' class="c"':'')+'>'+cell(c,r[j],j)+'</td>'}).join('')+'<td class="c"><button data-del title="Remove">✕</button></td></tr>'}).join('');
  if(!R.length)h+='<tr><td class="c" colspan="'+(sp.cols.length+1)+'" style="color:#7a6a6e;padding:14px">Nothing here yet.</td></tr>';
  h+='</tbody></table></div><div class="tools" style="margin-top:10px"><button id="padd">'+sp.add+'</button>'+(sp.sec==='checklist'&&!R.length?'<button id="pstart" class="g">Start with a suggested list</button>':'')+'</div><p class="say" id="psay"></p>';
  return h;
}
function wirePlanner(){
  if(!P){
    var go=function(){var v=$('pin').value.replace(/\D/g,'');if(v.length<4){psay('Type your PIN.');return}unlock(v)};
    $('pgo').onclick=go;$('pin').onkeydown=function(e){if(e.key==='Enter')go()};
    var sv=pstore();if(sv&&!PTRY){PTRY=true;unlock(sv,true)} // this phone or computer has opened the planner before
    return;
  }
  if(TAB==='p-seat')return wireSeat();
  if(TAB==='p-q')return wireQ();
  var sp=SPEC[TAB],R=P[sp.sec];
  [].forEach.call(document.querySelectorAll('.plan tr[data-i]'),function(tr){
    var i=Number(tr.getAttribute('data-i'));
    [].forEach.call(tr.querySelectorAll('[data-c]'),function(el){
      var on=function(){R[i][Number(el.getAttribute('data-c'))]=el.type==='checkbox'?(el.checked?'Yes':''):el.value;$('psum').innerHTML=gridSummary(sp);psave(sp.sec)};
      el.oninput=on;el.onchange=on;
    });
    tr.querySelector('[data-del]').onclick=function(){R.splice(i,1);draw();psave(sp.sec)};
  });
  $('padd').onclick=function(){
    var r=[];sp.cols.forEach(function(){r.push('')});R.push(r);draw();
    var rows=document.querySelectorAll('.plan tr[data-i]'),f=rows[rows.length-1].querySelector('input:not([type=checkbox])');if(f)f.focus();
  };
  if($('pstart'))$('pstart').onclick=function(){STARTER.forEach(function(t){R.push(['',t,'',''])});draw();psave(sp.sec)};
}
/* seating: tables are round cards; a guest is moved by tapping them and then a table, or by dragging */
function people(g){return g.rsvp==='Attending'?(Number(g.attending)||1):g.seats}
function seatHtml(){
  var G=(D.guests||[]).filter(function(g){return g.rsvp!=='Declined'}),by={},un=[];
  G.forEach(function(g){
    var t=String(g.table||'').trim();
    if(!t){un.push(g);return}
    if(!P.tables.some(function(x){return x[0]===t}))P.tables.push([t,'']); // a table typed in the guest list but not added here yet
    (by[t]=by[t]||[]).push(g);
  });
  var chip=function(g){return '<button class="chip'+(g.rsvp==='Attending'?'':' wait')+(SEL===g.row?' sel':'')+'" draggable="true" data-row="'+g.row+'">'+esc((g.first+' '+g.last).trim())+(people(g)>1?' <i>'+people(g)+'</i>':'')+'</button>'};
  var cnt=function(L){var n=0;L.forEach(function(g){n+=people(g)});return n};
  var h='<p class="note2">Tap a guest, then tap a table to seat them there (on a computer you can also drag). Tap “Not seated yet” to take them off a table. Dotted names have not replied yet; guests who declined are left out.</p>';
  h+='<div class="tools"><input id="tn" maxlength="20" placeholder="Table name or number"><input id="tc" type="number" min="1" max="99" value="10" style="flex:0 0 84px" title="Seats at this table"><button id="tadd">Add table</button></div>';
  h+='<div class="drop un" data-t=""><div class="th"><b>Not seated yet</b><span>'+cnt(un)+' people</span></div><div class="chips">'+(un.map(chip).join('')||'<em>Everyone has a table.</em>')+'</div></div>';
  h+='<div class="tbls">'+P.tables.map(function(t,i){
    var L=by[t[0]]||[],n=cnt(L),cap=Number(t[1])||0;
    return '<div class="drop tbl" data-t="'+esc(t[0])+'"><div class="round'+(cap&&n>cap?' over':'')+'"><b>'+esc(t[0])+'</b><span>'+n+(cap?' / '+cap:'')+'</span></div><div class="chips">'+(L.map(chip).join('')||'<em>Empty</em>')+'</div><button class="rmt" data-rmt="'+i+'">Remove table</button></div>';
  }).join('')+'</div><p class="say" id="psay"></p>';
  return h;
}
function seatGuest(g,table,done){
  g.table=table;
  google.script.run.withSuccessHandler(function(){if(done)done()}).withFailureHandler(function(e){psay((e&&e.message)||'That did not save. Please try again.')}).couple_guest_save(KEY,{row:g.row,first:g.first,last:g.last,seats:g.seats,table:table});
}
function seatMove(row,table){
  var g=(D.guests||[]).filter(function(x){return x.row===row})[0];SEL=0;
  if(!g||String(g.table||'').trim()===table){draw();return}
  seatGuest(g,table,function(){psay('Saved ✓')});draw();psay('Saving…');
}
function wireSeat(){
  [].forEach.call(document.querySelectorAll('.chip'),function(c){
    var row=Number(c.getAttribute('data-row'));
    c.onclick=function(e){e.stopPropagation();SEL=SEL===row?0:row;draw()};
    c.ondragstart=function(e){e.dataTransfer.setData('text/plain',String(row))};
  });
  [].forEach.call(document.querySelectorAll('.drop'),function(d){
    var t=d.getAttribute('data-t');
    d.onclick=function(){if(SEL)seatMove(SEL,t)};
    d.ondragover=function(e){e.preventDefault();d.classList.add('hot')};
    d.ondragleave=function(){d.classList.remove('hot')};
    d.ondrop=function(e){e.preventDefault();seatMove(Number(e.dataTransfer.getData('text/plain')),t)};
  });
  $('tn').onclick=$('tc').onclick=function(e){e.stopPropagation()};
  $('tadd').onclick=function(){
    var n=$('tn').value.trim().slice(0,20);
    if(!n){psay('Give the table a name or number.');return}
    if(P.tables.some(function(t){return t[0]===n})){psay('There is already a table with that name.');return}
    P.tables.push([n,String($('tc').value||'')]);draw();psave('tables');
  };
  [].forEach.call(document.querySelectorAll('[data-rmt]'),function(b){b.onclick=function(e){
    e.stopPropagation();
    var i=Number(b.getAttribute('data-rmt')),name=P.tables[i][0],L=(D.guests||[]).filter(function(g){return String(g.table||'').trim()===name});
    if(L.length&&!confirm('Remove this table? Its '+L.length+' invitation(s) go back to “Not seated yet”.'))return;
    P.tables.splice(i,1);L.forEach(function(g){seatGuest(g,'')});draw();psave('tables');
  }});
}
/* the couple's own questions for guests, and what guests answered */
function qHtml(){
  var Q=P.questions,h='<p class="note2">Ask your guests up to 5 of your own questions. They answer when they accept the invitation. Add choices to let them pick from a list, or leave the choices empty for a typed answer.</p><div class="card pad">';
  h+=Q.map(function(q,i){return '<div class="qrow" data-i="'+i+'"><input data-f="q" maxlength="140" placeholder="Your question, e.g. Any food allergies?" value="'+esc(q.q)+'"><input data-f="o" placeholder="Choices, separated by commas (optional)" value="'+esc((q.options||[]).join(', '))+'"><button data-del title="Remove">✕</button></div>'}).join('')||'<p class="msg" style="padding:10px">No questions yet.</p>';
  h+='</div><div class="tools" style="margin-top:10px">'+(Q.length<5?'<button id="qadd" class="g">Add a question</button>':'')+'<button id="qsave">Save questions</button></div><p class="say" id="psay"></p>';
  var A=(D.guests||[]).filter(function(g){return g.answers});
  h+='<div class="hid">Answers ('+A.length+')</div>';
  Q.forEach(function(q){
    if(!q.options||!q.options.length)return;
    var t={};A.forEach(function(g){g.answers.split('\n').forEach(function(l){if(l.indexOf(q.q+': ')===0){var a=l.slice(q.q.length+2);t[a]=(t[a]||0)+1}})});
    h+='<div class="card pad" style="margin-bottom:10px"><b>'+esc(q.q)+'</b><div class="note2" style="margin:6px 0 0">'+q.options.map(function(o){return esc(o)+': <b>'+(t[o]||0)+'</b>'}).join(' · ')+'</div></div>';
  });
  h+='<div class="card">'+(A.length?A.map(function(g){return '<div class="bubble"><b>'+esc((g.first+' '+g.last).trim())+'</b><p>'+esc(g.answers)+'</p></div>'}).join(''):'<p class="msg">No answers yet.</p>')+'</div>';
  return h;
}
function wireQ(){
  var read=function(){return [].map.call(document.querySelectorAll('.qrow'),function(r){return {q:r.querySelector('[data-f=q]').value.trim(),options:r.querySelector('[data-f=o]').value.split(',').map(function(x){return x.trim()}).filter(Boolean)}})};
  [].forEach.call(document.querySelectorAll('.qrow [data-del]'),function(b){b.onclick=function(){var L=read();L.splice(Number(b.parentNode.getAttribute('data-i')),1);P.questions=L;draw();psay('Remember to press Save questions.')}});
  if($('qadd'))$('qadd').onclick=function(){P.questions=read();P.questions.push({q:'',options:[]});draw()};
  $('qsave').onclick=function(){psay('Saving…');pcall('planner_questions',[read()],function(q){P.questions=q;draw();psay('Saved ✓ Guests see these when they accept.')})};
}
function call(fn,args,ok){
  $('say').textContent='Saving…';
  var r=google.script.run.withSuccessHandler(function(x){ok(x)}).withFailureHandler(function(e){$('say').textContent=(e&&e.message)||'That did not work. Please try again.'});
  r[fn].apply(r,[KEY].concat(args));
}
function wireSheet(){
  var link=function(code){return new URL('../i/?code='+encodeURIComponent(D.code+'-'+code),location.href).href};
  [].forEach.call(document.querySelectorAll('.sheet tr[data-r]'),function(tr){
    var row=Number(tr.getAttribute('data-r'));
    var val=function(f){return tr.querySelector('[data-f="'+f+'"]').value.trim()};
    [].forEach.call(tr.querySelectorAll('input'),function(i){i.onchange=function(){
      if(!val('last')){$('say').textContent=row?'A last name is needed.':'Add the last name too, then it saves.';return}
      call('couple_guest_save',[{row:row,first:val('first'),last:val('last'),seats:val('seats')||1,table:val('table')}],function(){if(row)$('say').textContent='Saved.';else load()});
    }});
    var cp=tr.querySelector('[data-cp]'),nw=tr.querySelector('[data-nw]'),rm=tr.querySelector('[data-rm]');
    if(cp)cp.onclick=function(){var u=link(cp.getAttribute('data-cp'));var done=function(){cp.textContent='Copied ✓';setTimeout(function(){cp.textContent='Copy link'},1500)};if(navigator.clipboard)navigator.clipboard.writeText(u).then(done,function(){prompt('Copy this link',u)});else prompt('Copy this link',u)};
    if(nw)nw.onclick=function(){if(tr.querySelector('[data-cp]')&&!confirm('Give this guest a new code? Their old code and link will stop working.'))return;call('couple_codes',[row],load)};
    if(rm)rm.onclick=function(){if(confirm('Remove this guest from the list? Their code stops working and their reply is cleared.'))call('couple_guest_clear',[row],load)};
  });
  $('gm').onclick=function(){call('couple_codes',['missing'],function(n){load();})};
  $('ga').onclick=function(){if(confirm('Replace EVERY guest\'s code? All the old codes and links stop working.'))call('couple_codes',['all'],load)};
}
var CUR=null;
function closeLb(){$('lb').hidden=true;$('bd').innerHTML='';CUR=null}
// hide / show again / delete the photo that is open, then reload the lists
function photoAct(action){
  if(!CUR)return;
  if(action==='delete'&&!confirm('Delete this for good? It moves to the Google Drive trash and disappears for everyone.'))return;
  $('ph').disabled=$('pd').disabled=true;$('pm').textContent='Working…';
  google.script.run.withSuccessHandler(function(){closeLb();load()}).withFailureHandler(function(e){$('ph').disabled=$('pd').disabled=false;$('pm').textContent=(e&&e.message)||'That did not work. Please try again.'}).couple_photo(KEY,CUR.g.id,action);
}
function show(g,hidden){
  CUR={g:g,hidden:!!hidden};$('ph').textContent=hidden?'Show again':'Hide';$('ph').disabled=$('pd').disabled=false;$('pm').textContent=hidden?'Hidden: guests cannot see this one.':'';
  $('bd').innerHTML=g.type==='video'?'<iframe allow="autoplay; fullscreen" allowfullscreen src="https://drive.google.com/file/d/'+encodeURIComponent(g.id)+'/preview"></iframe>':'<img alt="" src="https://drive.google.com/thumbnail?id='+encodeURIComponent(g.id)+'&sz=w1600">';
  $('dl').href='https://drive.google.com/file/d/'+encodeURIComponent(g.id)+'/view';$('lb').hidden=false;
}
$('lbx').onclick=closeLb;
$('ph').onclick=function(){photoAct(CUR&&CUR.hidden?'show':'hide')};
$('pd').onclick=function(){photoAct('delete')};
google.script.url.getLocation(function(loc){KEY=(loc.parameter||{}).view||'';load();setInterval(function(){if($('lb').hidden&&TAB!=='list'&&TAB.indexOf('p-')!==0)load()},60000)});
</script></body></html>
